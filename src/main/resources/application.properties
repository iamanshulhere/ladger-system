# Server
server.port=${SERVER_PORT:3000}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# MongoDB. Multi-document transactions require a replica set or sharded cluster.
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/backend-ledger}
spring.data.mongodb.auto-index-creation=true

# Authentication
jwt.secret=${JWT_SECRET:}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:3}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# Logging
logging.level.com.ledger=INFO
logging.level.org.springframework.data.mongodb=WARN